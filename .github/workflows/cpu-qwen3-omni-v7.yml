name: "MOSS-TTS BCG CPU validation"

on:
  push:
    branches:
      - cpu-validation/qwen3-omni-pcg-v7
  workflow_dispatch:

permissions:
  contents: read

env:
  # Exact MOSS-TTS BCG candidate under validation.
  TARGET_SHA: 347ef512f969753d989e7a44615570186b9ad577
  # Exact direct parent, which is current upstream main at candidate creation.
  BASE_SHA: 9bc2cd7d91059c88565c163344d9a094d4cbd5d3
  TEST_VENV: /tmp/sglang-omni-cpu-venv

jobs:
  moss-tts-cpu:
    name: "MOSS-TTS BCG CPU gate"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: hongccc/sglang-omni@sha256:374d0b1c30b2bff685b1716fc64a02ad3b3d0a90fe2ce73ce9861a6992c28101

    steps:
      - name: Checkout exact MOSS-TTS candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Configure Git safe directory
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify candidate provenance
        shell: bash
        run: |
          set -euxo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          ACTUAL_PARENT="$(git rev-parse "${TARGET_SHA}^")"
          test "${ACTUAL}" = "${TARGET_SHA}"
          test "${ACTUAL_PARENT}" = "${BASE_SHA}"
          git merge-base --is-ancestor "${BASE_SHA}" "${TARGET_SHA}"
          echo "=== Candidate commits ==="
          git log --oneline "${BASE_SHA}..${TARGET_SHA}"
          echo "=== Candidate diff stat ==="
          git diff --stat "${BASE_SHA}...${TARGET_SHA}"
          echo "=== Candidate changed files ==="
          git diff --name-only "${BASE_SHA}...${TARGET_SHA}"
          echo "=== Runtime ==="
          uname -a
          python --version

      - name: Inspect preinstalled runtime
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import sys
          import numpy
          import pydantic
          import sglang
          import torch
          import transformers
          print("python:", sys.version)
          print("torch:", torch.__version__)
          print("transformers:", transformers.__version__)
          print("sglang:", getattr(sglang, "__version__", "unknown"))
          print("numpy:", numpy.__version__)
          print("pydantic:", pydantic.__version__)
          print("torch.cuda.is_available:", torch.cuda.is_available())
          PY

      - name: Create CPU test virtualenv
        shell: bash
        run: |
          set -euxo pipefail
          if ! python -m venv --system-site-packages "${TEST_VENV}"; then
            apt-get update
            apt-get install -y --no-install-recommends python3.12-venv
            rm -rf "${TEST_VENV}"
            python -m venv --system-site-packages "${TEST_VENV}"
          fi
          "${TEST_VENV}/bin/python" - <<'PY'
          import pre_commit, pytest, sglang, torch, transformers
          print("pytest:", pytest.__version__)
          print("pre_commit:", pre_commit.__file__)
          print("sglang:", getattr(sglang, "__version__", "unknown"))
          print("torch:", torch.__version__)
          print("transformers:", transformers.__version__)
          PY

      # Candidate-specific contract checks. Continue so the run collects all evidence.
      - name: MOSS prefill sidecar contract
        id: sidecar
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          "${TEST_VENV}/bin/python" -m pytest -q \
            tests/unit_test/moss_tts/test_pipeline.py::test_moss_prefill_forward_uses_prompt_row_embeds \
            tests/unit_test/model_runner/test_prefill_inputs.py \
            tests/unit_test/model_runner/test_prefill_forward_kwargs.py

      - name: MOSS BCG capability contract
        id: capability
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          "${TEST_VENV}/bin/python" -m pytest -q \
            tests/unit_test/moss_tts/test_sampling_cuda_graph.py::test_engine_builder_allows_breakable_prefill_as_an_opt_in \
            tests/unit_test/models/test_model_capabilities.py

      - name: Late-bound model forward compatibility
        id: forward_contract
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          "${TEST_VENV}/bin/python" - <<'PY'
          import inspect

          from sglang_omni.models.moss_tts.sglang_model import MossTTSDelaySGLangModel

          params = inspect.signature(MossTTSDelaySGLangModel.forward).parameters
          accepts_kwargs = any(
              p.kind is inspect.Parameter.VAR_KEYWORD for p in params.values()
          )
          print("MossTTSDelaySGLangModel.forward parameters:", list(params))
          for required in ("input_embeds", "omni_prefill_rids"):
              if required not in params and not accepts_kwargs:
                  raise AssertionError(
                      f"late-bound Omni prefill kwarg {required!r} is not accepted "
                      "by MossTTSDelaySGLangModel.forward"
                  )
          print("late-bound forward contract: OK")
          PY

      - name: CPU-compatible MOSS-TTS unit suite
        id: moss_cpu
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          "${TEST_VENV}/bin/python" -m pytest -q tests/unit_test/moss_tts

      - name: Shared prefill infrastructure regression
        id: shared_prefill
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          "${TEST_VENV}/bin/python" -m pytest -q \
            tests/unit_test/model_runner/test_prefill_inputs.py \
            tests/unit_test/model_runner/test_prefill_forward_kwargs.py \
            tests/unit_test/model_runner/test_cuda_graph_batch_validator.py

      - name: Verify MOSS-TTS candidate patch scope
        id: scope
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          actual="$(git diff --name-only "${BASE_SHA}...${TARGET_SHA}" | sort)"
          expected="$(printf '%s\n' \
            'sglang_omni/models/moss_tts/__init__.py' \
            'sglang_omni/models/moss_tts/engine_builder.py' \
            'sglang_omni/models/moss_tts/model_runner.py' \
            'tests/unit_test/models/test_model_capabilities.py' \
            'tests/unit_test/moss_tts/test_pipeline.py' \
            'tests/unit_test/moss_tts/test_sampling_cuda_graph.py' \
            | sort)"
          echo "=== Expected ==="
          printf '%s\n' "${expected}"
          echo "=== Actual ==="
          printf '%s\n' "${actual}"
          diff -u <(printf '%s\n' "${expected}") <(printf '%s\n' "${actual}")

      - name: Pre-commit on changed files
        id: precommit
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          "${TEST_VENV}/bin/python" -m pre_commit run --files \
            sglang_omni/models/moss_tts/__init__.py \
            sglang_omni/models/moss_tts/engine_builder.py \
            sglang_omni/models/moss_tts/model_runner.py \
            tests/unit_test/models/test_model_capabilities.py \
            tests/unit_test/moss_tts/test_pipeline.py \
            tests/unit_test/moss_tts/test_sampling_cuda_graph.py \
            --show-diff-on-failure

      - name: Diff and working-tree sanity
        id: diff_sanity
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check "${BASE_SHA}...${TARGET_SHA}"
          git status --short
          test -z "$(git status --porcelain)"

      - name: CPU validation summary
        if: always()
        shell: bash
        run: |
          echo "## MOSS-TTS BCG CPU validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: \`${TARGET_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Base: \`${BASE_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Outcome |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Prefill sidecar | ${{ steps.sidecar.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| BCG capability | ${{ steps.capability.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Late-bound model forward | ${{ steps.forward_contract.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| MOSS-TTS CPU suite | ${{ steps.moss_cpu.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Shared prefill infrastructure | ${{ steps.shared_prefill.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Exact candidate scope | ${{ steps.scope.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pre-commit | ${{ steps.precommit.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Diff sanity | ${{ steps.diff_sanity.outcome }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Final MOSS-TTS CPU validation gate
        if: always()
        shell: bash
        env:
          SIDECAR: ${{ steps.sidecar.outcome }}
          CAPABILITY: ${{ steps.capability.outcome }}
          FORWARD_CONTRACT: ${{ steps.forward_contract.outcome }}
          MOSS_CPU: ${{ steps.moss_cpu.outcome }}
          SHARED_PREFILL: ${{ steps.shared_prefill.outcome }}
          SCOPE: ${{ steps.scope.outcome }}
          PRECOMMIT: ${{ steps.precommit.outcome }}
          DIFF_SANITY: ${{ steps.diff_sanity.outcome }}
        run: |
          set -euxo pipefail
          failed=0
          check() {
            local name="$1"
            local outcome="$2"
            if [[ "${outcome}" != "success" ]]; then
              echo "::error::${name} outcome=${outcome}"
              failed=1
            else
              echo "${name}: success"
            fi
          }
          check "prefill-sidecar" "${SIDECAR}"
          check "bcg-capability" "${CAPABILITY}"
          check "late-bound-forward" "${FORWARD_CONTRACT}"
          check "moss-cpu-suite" "${MOSS_CPU}"
          check "shared-prefill" "${SHARED_PREFILL}"
          check "patch-scope" "${SCOPE}"
          check "precommit" "${PRECOMMIT}"
          check "diff-sanity" "${DIFF_SANITY}"
          if [[ "${failed}" -ne 0 ]]; then
            echo "One or more MOSS-TTS CPU validation checks failed."
            exit 1
          fi
          echo "All MOSS-TTS CPU validation checks passed."
