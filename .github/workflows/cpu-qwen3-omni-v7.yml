name: "Qwen3-Omni #1515 CPU validation"

on:
  push:
    branches:
      - cpu-validation/qwen3-omni-pcg-v7

  # This becomes manually usable if/when the workflow also exists
  # on the repository default branch. The push trigger above is
  # the primary trigger for this temporary validation branch.
  workflow_dispatch:

permissions:
  contents: read

env:
  # Exact #1515 candidate under validation. Keep this pinned so the
  # validation result is attributable to the exact tree intended for PR.
  TARGET_SHA: b0678bcce546730d0dfaff0fdbb7bd3d289a7ea0

  # Exact parent/base of TARGET_SHA. Used only for candidate provenance,
  # patch-scope validation, and committed-diff hygiene checks.
  BASE_SHA: 86a7d48119551474add1cd371c619a70df0e6673

  # Keep test tooling isolated from the container's system Python,
  # while inheriting its preinstalled SGLang/PyTorch runtime packages.
  TEST_VENV: /tmp/sglang-omni-cpu-venv

jobs:
  qwen3-omni-cpu:
    name: "Qwen3-Omni #1515 CPU gate"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # Match the environment family previously used successfully for
    # Qwen3-Omni CPU qualification. The container already includes the
    # heavyweight torch/sglang/transformers runtime, so this workflow does
    # not reinstall those packages.
    container:
      image: hongccc/sglang-omni@sha256:374d0b1c30b2bff685b1716fc64a02ad3b3d0a90fe2ce73ce9861a6992c28101

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout the exact #1515 candidate.
      #
      # The workflow itself lives on the temporary cpu-validation branch,
      # while the source tree tested below is exactly TARGET_SHA.
      # -----------------------------------------------------------------------

      - name: "Checkout #1515 candidate"
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      # actions/checkout configures safe.directory using a temporary HOME.
      # Commands below execute inside the job container with HOME=/github/home,
      # so explicitly trust only this workspace.
      - name: Configure Git safe directory
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify candidate provenance
        shell: bash
        run: |
          set -euxo pipefail

          ACTUAL="$(git rev-parse HEAD)"

          echo "Expected candidate SHA: ${TARGET_SHA}"
          echo "Actual candidate SHA:   ${ACTUAL}"
          echo "Candidate base SHA:     ${BASE_SHA}"

          test "${ACTUAL}" = "${TARGET_SHA}"
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "${BASE_SHA}" "${TARGET_SHA}"

          echo
          echo "=== Candidate commits ==="
          git log --oneline "${BASE_SHA}..${TARGET_SHA}"

          echo
          echo "=== Candidate diff stat ==="
          git diff --stat "${BASE_SHA}...${TARGET_SHA}"

          echo
          echo "=== Candidate changed files ==="
          git diff --name-only "${BASE_SHA}...${TARGET_SHA}"

          echo
          echo "=== Git status ==="
          git status --short

          echo
          echo "=== Host/container information ==="
          uname -a
          uname -m
          python --version

          echo
          echo "=== Filesystem ==="
          df -h

      # -----------------------------------------------------------------------
      # 2. Confirm the pinned container still provides the heavyweight runtime.
      #    We deliberately do NOT reinstall torch/sglang/transformers.
      # -----------------------------------------------------------------------

      - name: Inspect preinstalled runtime
        shell: bash
        run: |
          set -euxo pipefail

          python - <<'PY'
          import sys

          import numpy
          import pydantic
          import sglang
          import torch
          import transformers
          import typer

          print("python:", sys.version)
          print("torch:", torch.__version__)
          print("transformers:", transformers.__version__)
          print("sglang:", getattr(sglang, "__version__", "unknown"))
          print("numpy:", numpy.__version__)
          print("pydantic:", pydantic.__version__)
          print("typer:", typer.__version__)
          print("torch.cuda.is_available:", torch.cuda.is_available())
          print("preinstalled runtime: OK")
          PY

      # -----------------------------------------------------------------------
      # 3. Create a small test-tools venv.
      #
      # --system-site-packages reuses the container's existing runtime without
      # modifying the externally-managed system Python. If venv support is
      # unexpectedly absent, install only python3.12-venv and retry.
      # -----------------------------------------------------------------------

      - name: Create CPU test virtualenv
        shell: bash
        run: |
          set -euxo pipefail

          if ! python -m venv --system-site-packages "${TEST_VENV}"; then
            echo "python venv support missing; installing python3.12-venv"
            apt-get update
            apt-get install -y --no-install-recommends python3.12-venv
            rm -rf "${TEST_VENV}"
            python -m venv --system-site-packages "${TEST_VENV}"
          fi

          "${TEST_VENV}/bin/python" - <<'PY'
          import numpy
          import pydantic
          import pre_commit
          import pytest
          import sglang
          import torch
          import transformers
          import typer

          print("torch:", torch.__version__)
          print("transformers:", transformers.__version__)
          print("sglang:", getattr(sglang, "__version__", "unknown"))
          print("numpy:", numpy.__version__)
          print("pydantic:", pydantic.__version__)
          print("typer:", typer.__version__)
          print("pytest:", pytest.__version__)
          print("pre_commit:", pre_commit.__file__)
          print("test virtualenv: OK")
          PY

          "${TEST_VENV}/bin/python" -m pre_commit --version

      # -----------------------------------------------------------------------
      # 4. #1515 load-bearing tests.
      #
      # Individual test steps use continue-on-error so later evidence still
      # runs and the final gate reports every outcome together.
      # -----------------------------------------------------------------------

      - name: "Focused #1515 lifecycle regression"
        id: lifecycle
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail

          "${TEST_VENV}/bin/python" -m pytest -q \
            tests/unit_test/qwen3_omni/test_pipeline.py \
            -k "qwen_thinker_cuda_graph_capture"

      - name: Full Qwen3-Omni pipeline and bootstrap tests
        id: pipeline
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail

          "${TEST_VENV}/bin/python" -m pytest -q \
            tests/unit_test/qwen3_omni/test_pipeline.py

      # -----------------------------------------------------------------------
      # 5. Broader CPU regression coverage.
      #
      # Preserve broad CPU-compatible Qwen3-Omni regression coverage.
      #
      # Exclusions:
      #
      # - test_talker.py / test_talker_attention.py:
      #   collection requires CUDA-loaded sgl_kernel operators.
      #
      # - Two Code2Wav CUDA-graph factory tests:
      #   these explicitly exercise CUDA device normalization through
      #   current_platform.get_device(...). On the GitHub CPU runner SGLang's
      #   platform is device=unknown and get_device() is unsupported.
      #
      # These paths are unchanged by #1515. Keep every other Code2Wav test in
      # the CPU sweep rather than ignoring test_code2wav.py wholesale.
      # -----------------------------------------------------------------------

      - name: CPU-compatible Qwen3-Omni unit suite
        id: qwen_cpu
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail

          "${TEST_VENV}/bin/python" -m pytest -q \
            tests/unit_test/qwen3_omni \
            --ignore=tests/unit_test/qwen3_omni/test_talker.py \
            --ignore=tests/unit_test/qwen3_omni/test_talker_attention.py \
            --deselect=tests/unit_test/qwen3_omni/test_code2wav.py::test_qwen_code2wav_enabled_factory_normalizes_device_and_derives_graph_keys \
            --deselect=tests/unit_test/qwen3_omni/test_code2wav.py::test_qwen_code2wav_enabled_factory_logs_disabled_build_reason

      # -----------------------------------------------------------------------
      # 6. Candidate scope and source hygiene.
      #
      # #1515 is intentionally surgical. Fail the validation if the exact
      # candidate grows beyond the two reviewed files.
      # -----------------------------------------------------------------------

      - name: "Verify #1515 patch scope"
        id: scope
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail

          actual="$(git diff --name-only "${BASE_SHA}...${TARGET_SHA}" | sort)"
          expected="$(printf '%s\n' \
            'sglang_omni/models/qwen3_omni/bootstrap.py' \
            'tests/unit_test/qwen3_omni/test_pipeline.py' \
            | sort)"

          echo "=== Expected changed files ==="
          printf '%s\n' "${expected}"

          echo
          echo "=== Actual changed files ==="
          printf '%s\n' "${actual}"

          diff -u \
            <(printf '%s\n' "${expected}") \
            <(printf '%s\n' "${actual}")

      - name: Pre-commit on changed files
        id: precommit
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail

          "${TEST_VENV}/bin/python" -m pre_commit run \
            --files \
            sglang_omni/models/qwen3_omni/bootstrap.py \
            tests/unit_test/qwen3_omni/test_pipeline.py \
            --show-diff-on-failure

      - name: Committed diff and working-tree sanity
        id: diff_sanity
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail

          # Check the committed candidate diff, not only an empty working-tree
          # diff after checkout.
          git diff --check "${BASE_SHA}...${TARGET_SHA}"

          echo
          echo "=== Git status after tests and pre-commit ==="
          git status --short

          # pre-commit must not leave auto-fixes or other tracked/untracked
          # changes behind in the exact candidate checkout.
          test -z "$(git status --porcelain)"

      # -----------------------------------------------------------------------
      # 7. Always publish a concise evidence summary.
      # -----------------------------------------------------------------------

      - name: CPU validation summary
        if: always()
        shell: bash
        run: |
          echo "## Qwen3-Omni #1515 CPU validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: \`${TARGET_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Base: \`${BASE_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Outcome |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Focused #1515 lifecycle | ${{ steps.lifecycle.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pipeline/bootstrap file | ${{ steps.pipeline.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CPU-compatible Qwen3-Omni | ${{ steps.qwen_cpu.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Exact two-file scope | ${{ steps.scope.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pre-commit changed files | ${{ steps.precommit.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Diff / working-tree sanity | ${{ steps.diff_sanity.outcome }} |" >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      # 8. Fail exactly once, after every check has had a chance to run.
      # -----------------------------------------------------------------------

      - name: "Final #1515 CPU validation gate"
        if: always()
        shell: bash
        env:
          LIFECYCLE: ${{ steps.lifecycle.outcome }}
          PIPELINE: ${{ steps.pipeline.outcome }}
          QWEN_CPU: ${{ steps.qwen_cpu.outcome }}
          SCOPE: ${{ steps.scope.outcome }}
          PRECOMMIT: ${{ steps.precommit.outcome }}
          DIFF_SANITY: ${{ steps.diff_sanity.outcome }}
        run: |
          set -euxo pipefail

          failed=0

          check() {
            local name="$1"
            local outcome="$2"

            if [[ "${outcome}" != "success" ]]; then
              echo "::error::${name} outcome=${outcome}"
              failed=1
            else
              echo "${name}: success"
            fi
          }

          check "focused-lifecycle" "${LIFECYCLE}"
          check "pipeline-bootstrap" "${PIPELINE}"
          check "qwen-cpu" "${QWEN_CPU}"
          check "patch-scope" "${SCOPE}"
          check "precommit" "${PRECOMMIT}"
          check "diff-sanity" "${DIFF_SANITY}"

          if [[ "${failed}" -ne 0 ]]; then
            echo
            echo "One or more #1515 CPU validation checks failed."
            echo "Review every failed step above before opening the upstream PR."
            exit 1
          fi

          echo
          echo "All #1515 CPU validation checks passed."
