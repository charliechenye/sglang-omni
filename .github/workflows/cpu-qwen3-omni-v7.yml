name: "FishAudio S2-Pro BCG CPU validation"

on:
  push:
    branches:
      - cpu-validation/qwen3-omni-pcg-v7
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_SHA: 4c8d337f332dfb00e2f105ca7c6fed7b6e898afe
  BASE_SHA: 9bc2cd7d91059c88565c163344d9a094d4cbd5d3
  TEST_VENV: /tmp/sglang-omni-cpu-venv

jobs:
  fish-s2pro-cpu:
    name: "FishAudio S2-Pro BCG CPU gate"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: hongccc/sglang-omni@sha256:374d0b1c30b2bff685b1716fc64a02ad3b3d0a90fe2ce73ce9861a6992c28101

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify candidate provenance
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git cat-file -e "${BASE_SHA}^{commit}"
          test "$(git merge-base "${BASE_SHA}" "${TARGET_SHA}")" = "${BASE_SHA}"
          test "$(git rev-list --count "${BASE_SHA}..${TARGET_SHA}")" = "2"
          git log --oneline "${BASE_SHA}..${TARGET_SHA}"
          git diff --stat "${BASE_SHA}...${TARGET_SHA}"
          git diff --name-only "${BASE_SHA}...${TARGET_SHA}"

      - name: Verify pinned CPU runtime
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import sglang, torch, transformers
          print("torch", torch.__version__)
          print("sglang", getattr(sglang, "__version__", "unknown"))
          print("transformers", transformers.__version__)
          print("cuda", torch.cuda.is_available())
          assert getattr(sglang, "__version__", None) == "0.5.16"
          assert torch.cuda.is_available() is False
          PY

      - name: Create test environment
        shell: bash
        run: |
          set -euxo pipefail
          if ! python -m venv --system-site-packages "${TEST_VENV}"; then
            apt-get update
            apt-get install -y --no-install-recommends python3.12-venv
            rm -rf "${TEST_VENV}"
            python -m venv --system-site-packages "${TEST_VENV}"
          fi
          "${TEST_VENV}/bin/python" -c 'import pytest, pre_commit, sglang, torch'

      - name: Fish durable BCG contract tests
        id: contract
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          "${TEST_VENV}/bin/python" -m pytest -q \
            tests/unit_test/fishaudio_s2_pro/test_prefill_cuda_graph_contract.py

      - name: Full FishAudio S2-Pro CPU suite
        id: fish
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          "${TEST_VENV}/bin/python" -m pytest -q tests/unit_test/fishaudio_s2_pro

      - name: Shared prefill infrastructure regression
        id: shared
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          "${TEST_VENV}/bin/python" -m pytest -q \
            tests/unit_test/model_runner/test_prefill_inputs.py \
            tests/unit_test/model_runner/test_prefill_forward_kwargs.py \
            tests/unit_test/model_runner/test_cuda_graph_batch_validator.py \
            tests/unit_test/scheduling/test_prefill_graph_policy.py \
            tests/unit_test/models/test_model_capabilities.py

      - name: Verify candidate patch scope
        id: scope
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          actual="$(git diff --name-only "${BASE_SHA}...${TARGET_SHA}" | sort)"
          expected="$(printf '%s\n' \
            'sglang_omni/models/fishaudio_s2_pro/__init__.py' \
            'sglang_omni/models/fishaudio_s2_pro/engine_builder.py' \
            'sglang_omni/models/fishaudio_s2_pro/model_runner.py' \
            'sglang_omni/models/fishaudio_s2_pro/sglang_model.py' \
            'tests/unit_test/fishaudio_s2_pro/test_prefill_cuda_graph_contract.py' \
            'tests/unit_test/fishaudio_s2_pro/test_tts.py' \
            'tests/unit_test/models/test_model_capabilities.py' \
            | sort)"
          diff -u <(printf '%s\n' "${expected}") <(printf '%s\n' "${actual}")

      - name: Pre-commit on candidate files
        id: precommit
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          "${TEST_VENV}/bin/python" -m pre_commit run --files \
            sglang_omni/models/fishaudio_s2_pro/__init__.py \
            sglang_omni/models/fishaudio_s2_pro/engine_builder.py \
            sglang_omni/models/fishaudio_s2_pro/model_runner.py \
            sglang_omni/models/fishaudio_s2_pro/sglang_model.py \
            tests/unit_test/fishaudio_s2_pro/test_prefill_cuda_graph_contract.py \
            tests/unit_test/fishaudio_s2_pro/test_tts.py \
            tests/unit_test/models/test_model_capabilities.py \
            --show-diff-on-failure

      - name: Diff sanity
        id: diff
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check "${BASE_SHA}...${TARGET_SHA}"
          test -z "$(git status --porcelain)"

      - name: Validation summary
        if: always()
        shell: bash
        run: |
          echo "## FishAudio S2-Pro BCG CPU validation" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: \`${TARGET_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Base: \`${BASE_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Outcome |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Durable BCG contract | ${{ steps.contract.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Full Fish CPU suite | ${{ steps.fish.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Shared prefill infrastructure | ${{ steps.shared.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Patch scope | ${{ steps.scope.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pre-commit | ${{ steps.precommit.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Diff sanity | ${{ steps.diff.outcome }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce CPU gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for outcome in \
            "${{ steps.contract.outcome }}" \
            "${{ steps.fish.outcome }}" \
            "${{ steps.shared.outcome }}" \
            "${{ steps.scope.outcome }}" \
            "${{ steps.precommit.outcome }}" \
            "${{ steps.diff.outcome }}"; do
            test "${outcome}" = "success"
          done
          echo "FishAudio S2-Pro BCG CPU validation passed for ${TARGET_SHA}."
