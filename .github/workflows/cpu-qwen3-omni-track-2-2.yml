name: "Qwen3-Omni Track 2.2 CPU validation"

on:
  push:
    branches:
      - cpu-validation/qwen3-omni-track-2-2-contracts-v1

  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_SHA: 9a7e86fb0a19ac97d25c7d269d164391c3ec840f
  BASE_SHA: 573ce7963fa7b95596459957a195c87cf60cda19
  TEST_VENV: /tmp/sglang-omni-cpu-venv

jobs:
  qwen3-omni-cpu:
    name: "Qwen3-Omni Track 2.2 CPU gate"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    container:
      image: hongccc/sglang-omni@sha256:374d0b1c30b2bff685b1716fc64a02ad3b3d0a90fe2ce73ce9861a6992c28101

    steps:
      - name: "Checkout Track 2.2 candidate"
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Configure Git safe directory
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify candidate provenance
        shell: bash
        run: |
          set -euxo pipefail

          ACTUAL="$(git rev-parse HEAD)"

          echo "Expected candidate SHA: ${TARGET_SHA}"
          echo "Actual candidate SHA:   ${ACTUAL}"
          echo "Base SHA:               ${BASE_SHA}"

          test "${ACTUAL}" = "${TARGET_SHA}"
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "${BASE_SHA}" "${TARGET_SHA}"

          echo
          echo "=== Candidate commits ==="
          git log --oneline "${BASE_SHA}..${TARGET_SHA}"

          echo
          echo "=== Candidate diff stat ==="
          git diff --stat "${BASE_SHA}...${TARGET_SHA}"

          echo
          echo "=== Candidate changed files ==="
          git diff --name-only "${BASE_SHA}...${TARGET_SHA}"

          echo
          echo "=== Git status ==="
          git status --short

          echo
          echo "=== Host/container information ==="
          uname -a
          uname -m
          python --version

          echo
          echo "=== Filesystem ==="
          df -h

      - name: Inspect preinstalled runtime
        shell: bash
        run: |
          set -euxo pipefail

          python - <<'PY'
          import sys
          import numpy
          import pydantic
          import sglang
          import torch
          import transformers
          import typer

          print("python:", sys.version)
          print("torch:", torch.__version__)
          print("transformers:", transformers.__version__)
          print("sglang:", getattr(sglang, "__version__", "unknown"))
          print("numpy:", numpy.__version__)
          print("pydantic:", pydantic.__version__)
          print("typer:", typer.__version__)
          print("torch.cuda.is_available:", torch.cuda.is_available())
          print("preinstalled runtime: OK")
          PY

      - name: Create CPU test virtualenv
        shell: bash
        run: |
          set -euxo pipefail

          if ! python -m venv --system-site-packages "${TEST_VENV}"; then
            echo "python venv support missing; installing python3.12-venv"
            apt-get update
            apt-get install -y --no-install-recommends python3.12-venv
            rm -rf "${TEST_VENV}"
            python -m venv --system-site-packages "${TEST_VENV}"
          fi

          "${TEST_VENV}/bin/python" - <<'PY'
          import numpy
          import pydantic
          import pre_commit
          import pytest
          import sglang
          import torch
          import transformers
          import typer

          print("torch:", torch.__version__)
          print("transformers:", transformers.__version__)
          print("sglang:", getattr(sglang, "__version__", "unknown"))
          print("numpy:", numpy.__version__)
          print("pydantic:", pydantic.__version__)
          print("typer:", typer.__version__)
          print("pytest:", pytest.__version__)
          print("pre_commit:", pre_commit.__file__)
          print("test virtualenv: OK")
          PY

          "${TEST_VENV}/bin/python" -m pre_commit --version

      - name: Thinker to Talker payload contracts
        id: payload_contract
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail

          "${TEST_VENV}/bin/python" -m pytest -q \
            tests/unit_test/qwen3_omni/test_thinker_talker_payload.py

      - name: Qwen3-Omni streaming regression
        id: streaming
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail

          "${TEST_VENV}/bin/python" -m pytest -q \
            tests/unit_test/qwen3_omni/test_streaming.py

      - name: Qwen3-Omni pipeline regression
        id: pipeline
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail

          "${TEST_VENV}/bin/python" -m pytest -q \
            tests/unit_test/qwen3_omni/test_pipeline.py

      - name: CPU-compatible Qwen3-Omni unit suite
        id: qwen_cpu
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail

          "${TEST_VENV}/bin/python" -m pytest -q \
            tests/unit_test/qwen3_omni \
            --ignore=tests/unit_test/qwen3_omni/test_talker.py \
            --ignore=tests/unit_test/qwen3_omni/test_talker_attention.py \
            --deselect=tests/unit_test/qwen3_omni/test_code2wav.py::test_qwen_code2wav_enabled_factory_normalizes_device_and_derives_graph_keys \
            --deselect=tests/unit_test/qwen3_omni/test_code2wav.py::test_qwen_code2wav_enabled_factory_logs_disabled_build_reason \
            --deselect=tests/unit_test/qwen3_omni/test_code2wav.py::test_qwen_code2wav_factory_allows_batching_with_cuda_graph \
            --deselect=tests/unit_test/qwen3_omni/test_code2wav.py::test_qwen_code2wav_factory_combines_batching_with_cuda_graph \
            --deselect=tests/unit_test/qwen3_omni/test_code2wav.py::test_qwen_code2wav_factory_disables_batching_when_runner_disabled

      - name: Verify Track 2.2 investigation patch scope
        id: scope
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail

          actual="$(git diff --name-only "${BASE_SHA}...${TARGET_SHA}" | sort)"
          expected="tests/unit_test/qwen3_omni/test_thinker_talker_payload.py"

          echo "=== Expected changed files ==="
          printf '%s\n' "${expected}"

          echo
          echo "=== Actual changed files ==="
          printf '%s\n' "${actual}"

          diff -u \
            <(printf '%s\n' "${expected}") \
            <(printf '%s\n' "${actual}")

      - name: Pre-commit on changed files
        id: precommit
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail

          "${TEST_VENV}/bin/python" -m pre_commit run \
            --files \
            tests/unit_test/qwen3_omni/test_thinker_talker_payload.py \
            --show-diff-on-failure

      - name: Committed diff and working-tree sanity
        id: diff_sanity
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail

          git diff --check "${BASE_SHA}...${TARGET_SHA}"

          echo
          echo "=== Git status after tests and pre-commit ==="
          git status --short

          test -z "$(git status --porcelain)"

      - name: CPU validation summary
        if: always()
        shell: bash
        run: |
          echo "## Qwen3-Omni Track 2.2 CPU validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: \`${TARGET_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Base: \`${BASE_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Outcome |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Thinker to Talker payload contracts | ${{ steps.payload_contract.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Streaming regression | ${{ steps.streaming.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pipeline regression | ${{ steps.pipeline.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CPU-compatible Qwen3-Omni suite | ${{ steps.qwen_cpu.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Exact investigation scope | ${{ steps.scope.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pre-commit changed file | ${{ steps.precommit.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Diff / working-tree sanity | ${{ steps.diff_sanity.outcome }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Final Track 2.2 CPU validation gate
        if: always()
        shell: bash
        env:
          PAYLOAD_CONTRACT: ${{ steps.payload_contract.outcome }}
          STREAMING: ${{ steps.streaming.outcome }}
          PIPELINE: ${{ steps.pipeline.outcome }}
          QWEN_CPU: ${{ steps.qwen_cpu.outcome }}
          SCOPE: ${{ steps.scope.outcome }}
          PRECOMMIT: ${{ steps.precommit.outcome }}
          DIFF_SANITY: ${{ steps.diff_sanity.outcome }}
        run: |
          set -euxo pipefail

          failed=0

          check() {
            local name="$1"
            local outcome="$2"

            if [[ "${outcome}" != "success" ]]; then
              echo "::error::${name} outcome=${outcome}"
              failed=1
            else
              echo "${name}: success"
            fi
          }

          check "payload-contract" "${PAYLOAD_CONTRACT}"
          check "streaming" "${STREAMING}"
          check "pipeline" "${PIPELINE}"
          check "qwen-cpu" "${QWEN_CPU}"
          check "patch-scope" "${SCOPE}"
          check "precommit" "${PRECOMMIT}"
          check "diff-sanity" "${DIFF_SANITY}"

          if [[ "${failed}" -ne 0 ]]; then
            echo
            echo "One or more Track 2.2 CPU validation checks failed."
            echo "Review every failed step above before proceeding to GPU measurement."
            exit 1
          fi

          echo
          echo "All Track 2.2 CPU validation checks passed."
