name: "Apply MOSS-TTS formatting"

on:
  push:
    branches:
      - cpu-validation/qwen3-omni-pcg-v7
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-moss-tts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout MOSS-TTS branch
        uses: actions/checkout@v4
        with:
          ref: bcg/moss-tts
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact candidate
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "4e75b74ad635e5abd88df1d4e93e9878b51fd9ac"

      - name: Install pre-commit
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check pre-commit

      - name: Apply repository formatting
        shell: bash
        run: |
          set -euxo pipefail

          files=(
            sglang_omni/models/moss_tts/__init__.py
            sglang_omni/models/moss_tts/engine_builder.py
            sglang_omni/models/moss_tts/model_runner.py
            sglang_omni/models/moss_tts/sglang_model.py
            tests/unit_test/models/test_model_capabilities.py
            tests/unit_test/moss_tts/test_pipeline.py
            tests/unit_test/moss_tts/test_sampling_cuda_graph.py
          )

          # First pass may modify files. A second pass must be completely clean.
          python -m pre_commit run --files "${files[@]}" --show-diff-on-failure || true
          python -m pre_commit run --files "${files[@]}" --show-diff-on-failure
          git diff --check

      - name: Commit formatter output
        shell: bash
        run: |
          set -euxo pipefail

          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi

          echo "=== Formatter diff ==="
          git diff -- \
            sglang_omni/models/moss_tts/model_runner.py \
            tests/unit_test/moss_tts/test_pipeline.py

          # Fail if a hook changed anything outside the two files observed in CPU CI.
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'sglang_omni/models/moss_tts/model_runner.py' \
            'tests/unit_test/moss_tts/test_pipeline.py' \
            | sort)"
          diff -u <(printf '%s\n' "${expected}") <(printf '%s\n' "${actual}")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            sglang_omni/models/moss_tts/model_runner.py \
            tests/unit_test/moss_tts/test_pipeline.py
          git commit --no-verify -m "style(moss-tts): apply pre-commit formatting"
          git push origin HEAD:bcg/moss-tts
